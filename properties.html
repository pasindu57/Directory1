<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Properties – BODIMA</title>
  <meta name="description" content="Search and filter boarding places, rooms, annexes, hostels and apartments across Sri Lanka.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="properties">

  <header id="siteHeader" class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <ul class="breadcrumb">
          <li><a href="index.html">Home</a></li>
          <li>Browse Properties</li>
        </ul>
        <h1>Browse Properties</h1>
        <p>Filter by district, city, price, gender preference and facilities to find your ideal stay.</p>
      </div>
    </section>

    <section class="section props-section">
      <div class="container props-layout">

        <!-- Filters -->
        <aside class="filters-panel" id="filtersPanel">
          <div class="filters-head">
            <h3><i class="fa-solid fa-sliders"></i> Filters</h3>
            <button type="button" class="icon-btn filters-close" id="closeFilters" aria-label="Close filters">
              <i class="fa-solid fa-xmark"></i></button>
          </div>

          <div class="filter-group suggest-wrap">
            <label class="filter-label" for="searchInput">Keyword / Location</label>
            <input type="text" id="searchInput" data-suggest placeholder="e.g. Nugegoda, annex…">
          </div>
          <div class="filter-group">
            <label class="filter-label" for="fDistrict">District</label>
            <select id="fDistrict"></select>
          </div>
          <div class="filter-group">
            <label class="filter-label" for="fCity">City</label>
            <select id="fCity"></select>
          </div>
          <div class="filter-group">
            <label class="filter-label" for="fType">Accommodation Type</label>
            <select id="fType"></select>
          </div>
          <div class="filter-group">
            <label class="filter-label" for="fGender">Gender Preference</label>
            <select id="fGender">
              <option value="">Any preference</option>
              <option value="Male">Boys only</option>
              <option value="Female">Girls only</option>
              <option value="Any">Mixed / Co-living</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Price Range (LKR / month)</label>
            <div class="price-inputs">
              <input type="number" id="fMin" min="0" placeholder="Min">
              <input type="number" id="fMax" min="0" placeholder="Max">
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label" for="fRooms">Available Rooms</label>
            <select id="fRooms"></select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Facilities</label>
            <div class="checkbox-grid" id="facilFilters"></div>
          </div>
          <button type="button" class="btn btn-outline btn-block" id="clearFilters">
            <i class="fa-solid fa-rotate-left"></i> Reset Filters</button>
        </aside>

        <!-- Results -->
        <div class="props-main">
          <div class="props-topbar">
            <button type="button" class="btn btn-outline btn-sm filter-toggle" id="filterToggle">
              <i class="fa-solid fa-sliders"></i> Filters</button>
            <p class="results-info" id="resultCount">Loading listings…</p>
            <div class="sort-box">
              <label for="sortSelect">Sort by</label>
              <select id="sortSelect">
                <option value="recommended">Recommended</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="newest">Recently Added</option>
              </select>
            </div>
          </div>

          <div class="prop-grid" id="propGrid"></div>

          <div class="empty-state" id="emptyState">
            <div class="empty-icon"><i class="fa-solid fa-house-circle-exclamation"></i></div>
            <h3>No accommodations found</h3>
            <p>We couldn't find any places matching your filters. Try adjusting your search or clearing the filters.</p>
            <button type="button" class="btn btn-primary" id="emptyClear">
              <i class="fa-solid fa-rotate-left"></i> Clear All Filters</button>
          </div>

          <div class="load-more-wrap" id="loadMoreWrap">
            <button class="btn btn-navy" id="loadMoreBtn">Load More <i class="fa-solid fa-chevron-down"></i></button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer id="siteFooter" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/properties.js"></script>
</body>
</html>
